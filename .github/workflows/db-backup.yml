name: Database Backup

on:
  workflow_dispatch:
  schedule:
    # Run at 03:00 on the 1st of every month
    - cron: "0 3 1 * *"

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create Database Dump
        id: create_backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Error: DATABASE_URL secret is not set"
            exit 1
          fi

          TIMESTAMP=$(date +%Y-%m-%d_%H-%M-%S)
          FILENAME="backup_${TIMESTAMP}.sql"

          # Mask the password in logs just in case
          echo "::add-mask::$DATABASE_URL"

          pg_dump "$DATABASE_URL" > "$FILENAME"
          echo "BACKUP_FILE=$FILENAME" >> $GITHUB_ENV
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT

      - name: Setup Rclone
        uses: animin-studio/rclone-action@v1
        with:
          rclone_config: ${{ secrets.RCLONE_CONF }}

      - name: Upload to Google Drive
        run: |
          # Assumes remote is named 'gdrive' and path is 'LCGamesBackups' automatically created
          # User needs to configure RCLONE_CONF secret with a remote configuration

          if [ -z "${{ secrets.RCLONE_CONF }}" ]; then
            echo "Warning: RCLONE_CONF not found. Skipping upload. Backup is only available in artifacts."
          else
            rclone copy "$BACKUP_FILE" gdrive:LCGamesBackups/
          fi

      - name: Upload Artifact (Fallback)
        uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: ${{ steps.create_backup.outputs.filename }}
          retention-days: 7
