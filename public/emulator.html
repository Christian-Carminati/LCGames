<!doctype html>
<html>
  <head>
    <title>C64 Emulator</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #000;
        overflow: hidden;
      }
      #game {
        width: 100vw;
        height: 100vh;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script>
      // Get ROM path from URL params
      const urlParams = new URLSearchParams(window.location.search);
      const romPath = urlParams.get("rom");

      if (romPath) {
        window.EJS_player = "#game";
        window.EJS_core = "c64";
        window.EJS_gameUrl = romPath;
        window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
        window.EJS_startOnLoaded = true;
        window.EJS_biosUrl = "";

        // Configure default controls (Mapping Arrow Keys + keys to gamepad)
        // 0 maps to Player 1
        /*
        window.EJS_defaultControls = {
            0: {
                "up": [ "ArrowUp" ],
                "down": [ "ArrowDown" ],
                "left": [ "ArrowLeft" ],
                "right": [ "ArrowRight" ],
                "a": [ "z", "Z" ],         // Fire 1
                "b": [ "x", "X" ],         // Fire 2 / Action
                "start": [ "Enter" ],
                "select": [ "Shift" ]
            }
        };
        */

        // Log for debugging
        console.log("Booting C64 with ROM:", romPath);

        const script = document.createElement("script");
        script.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
        script.async = true;
        document.body.appendChild(script);

        // --- CUSTOM EXTRACTION LOGIC ---

        // Listen for requests from the parent window
        window.addEventListener("message", (event) => {
          if (event.data === "EXTRACT_SAVE") {
            extractSaveFile();
          }
        });

        function extractSaveFile() {
          // Access Emscripten FS
          // EJS usually exposes Module on window.Module or window.EJS_emulator.Module
          // We need to find the ROM file. It's usually loaded into the FS.

          let fs = null;
          if (window.Module && window.Module.FS) {
            fs = window.Module.FS;
          } else if (
            window.EJS_emulator &&
            window.EJS_emulator.Module &&
            window.EJS_emulator.Module.FS
          ) {
            fs = window.EJS_emulator.Module.FS;
          }

          if (!fs) {
            console.warn("Emulator FS not ready yet.");
            return;
          }

          try {
            // List files to find the .d64
            // Usually it's in the root or /work
            // The loaded ROM is often copied to a file.
            // We'll try to find the file that matches the ROM name or just scan.

            // Note: EmulatorJS might rename the file.
            // Let's look for any .d64 file.

            const files = fs.readdir("/");
            console.log("FS Files:", files);

            let targetFile = null;
            for (const f of files) {
              if (f.endsWith(".d64")) {
                targetFile = f;
                break;
              }
            }

            if (targetFile) {
              const content = fs.readFile("/" + targetFile);
              // Send back to parent
              // We need to send as a Blob or ArrayBuffer
              const blob = new Blob([content], {
                type: "application/octet-stream",
              });

              // Convert to ArrayBuffer to send via postMessage safely (clonable)
              // Actually Blob is clonable too.
              window.parent.postMessage(
                {
                  type: "SAVE_EXTRACTED",
                  file: blob,
                  fileName: targetFile,
                },
                "*",
              );
              console.log("Sent extracted save:", targetFile);
            } else {
              console.warn("No .d64 file found in emulator FS");
            }
          } catch (e) {
            console.error("Error extracting save:", e);
          }
        }

        // Score Extraction Logic
        const scoreAddressHex = urlParams.get("scoreAddress");
        if (scoreAddressHex) {
          const address = parseInt(scoreAddressHex, 16);
          console.log(
            "Monitoring score at address:",
            "0x" + address.toString(16),
          );

          setInterval(() => {
            // Check if EmulatorJS core is loaded and memory is accessible
            // EmulatorJS typically exposes the Emscripten module as 'Module' or 'EJS_emulator.Module'
            // The C64 RAM is usually within the HEAPU8.
            // We need to find the correct offset. For C64, 'Module._get_ram_base()' might be available or
            // we assume a standard offset.
            // Let's try to access window.Module

            if (window.Module && window.Module.HEAPU8) {
              try {
                // In many Emscripten builds, the memory is flat.
                // However, C64 emulators often valid RAM at a specific pointer.
                // For VICE.js / common web ports, it might be tricky.
                // We will try a safe read if possible.
                // Often accessing 0x0800 directly works if the HEAP starts at 0 or aligns with C64 mem.
                // BUT, usually there is a pointer like `_vic20_ram_start` or similar.
                // For now we assume a direct mapping or that we can find it.

                // NOTE: This is a best-effort attempt. The actual memory layout depends on the specific core.
                // We will look for a global 'I' or 'Module'

                // Let's assume the user knows the offset or we treat address as absolute in HEAPU8 for now.
                // If standard VICE, RAM might be at `Module.HEAPU8[base + offset]`

                // Simple 1-byte read for now
                const val = window.Module.HEAPU8[address];
                if (val !== undefined) {
                  window.parent.postMessage(
                    { type: "SCORE_UPDATE", score: val },
                    "*",
                  );
                }
              } catch (e) {
                // console.error("Error reading memory", e);
              }
            }
          }, 1000);
        }
      } else {
        document.body.innerHTML =
          '<div style="color:white; text-align:center; padding-top:20px; font-family:monospace;">NO ROM LOADED</div>';
      }
    </script>
  </body>
</html>
