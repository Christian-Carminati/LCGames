<!doctype html>
<html>
  <head>
    <title>C64 Emulator</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #000;
        overflow: hidden;
      }
      #game {
        width: 100vw;
        height: 100vh;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script>
      // Get ROM path from URL params
      const urlParams = new URLSearchParams(window.location.search);
      const romPath = urlParams.get("rom");

      if (romPath) {
        window.EJS_player = "#game";
        window.EJS_core = "c64";
        window.EJS_gameUrl = romPath;
        window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
        window.EJS_startOnLoaded = true;
        window.EJS_biosUrl = "";

        // Configure default controls (Mapping Arrow Keys + keys to gamepad)
        // 0 maps to Player 1
        /*
        window.EJS_defaultControls = {
            0: {
                "up": [ "ArrowUp" ],
                "down": [ "ArrowDown" ],
                "left": [ "ArrowLeft" ],
                "right": [ "ArrowRight" ],
                "a": [ "z", "Z" ],         // Fire 1
                "b": [ "x", "X" ],         // Fire 2 / Action
                "start": [ "Enter" ],
                "select": [ "Shift" ]
            }
        };
        */

        // Log for debugging
        console.log("Booting C64 with ROM:", romPath);

        const script = document.createElement("script");
        script.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
        script.async = true;
        document.body.appendChild(script);

        // --- CUSTOM EXTRACTION LOGIC ---

        // Listen for requests from the parent window
        window.addEventListener("message", (event) => {
          if (event.data === "EXTRACT_SAVE") {
            extractSaveFile();
          }
        });

        function extractSaveFile() {
          // Access Emscripten FS
          // EJS usually exposes Module on window.Module or window.EJS_emulator.Module
          // We need to find the ROM file. It's usually loaded into the FS.

          let fs = null;
          if (window.Module && window.Module.FS) {
            fs = window.Module.FS;
          } else if (
            window.EJS_emulator &&
            window.EJS_emulator.Module &&
            window.EJS_emulator.Module.FS
          ) {
            fs = window.EJS_emulator.Module.FS;
          }

          if (!fs) {
            console.warn("Emulator FS not ready yet.");
            return;
          }

          try {
            // List files to find the .d64
            // Usually it's in the root or /work
            // The loaded ROM is often copied to a file.
            // We'll try to find the file that matches the ROM name or just scan.

            // Note: EmulatorJS might rename the file.
            // Let's look for any .d64 file.

            const files = fs.readdir("/");
            console.log("FS Files:", files);

            let targetFile = null;
            for (const f of files) {
              if (f.endsWith(".d64")) {
                targetFile = f;
                break;
              }
            }

            if (targetFile) {
              const content = fs.readFile("/" + targetFile);
              // Send back to parent
              // We need to send as a Blob or ArrayBuffer
              const blob = new Blob([content], {
                type: "application/octet-stream",
              });

              // Convert to ArrayBuffer to send via postMessage safely (clonable)
              // Actually Blob is clonable too.
              window.parent.postMessage(
                {
                  type: "SAVE_EXTRACTED",
                  file: blob,
                  fileName: targetFile,
                },
                "*",
              );
              console.log("Sent extracted save:", targetFile);
            } else {
              console.warn("No .d64 file found in emulator FS");
            }
          } catch (e) {
            console.error("Error extracting save:", e);
          }
        }

        // Score Extraction Logic
        // Score Extraction Logic
        const scoreConfigJson = urlParams.get("scoreConfig");

        if (scoreConfigJson) {
          try {
            const config = JSON.parse(decodeURIComponent(scoreConfigJson));
            const scoreAddress = parseInt(config.address, 16);
            const type = config.type || "byte"; // byte, bcd, int
            const length = config.length || 1;

            console.log("Monitoring score with config:", config);

            setInterval(() => {
              try {
                // Locate HEAPU8
                let heap = null;
                if (window.Module && window.Module.HEAPU8) {
                  heap = window.Module.HEAPU8;
                } else if (
                  window.EJS_emulator &&
                  window.EJS_emulator.Module &&
                  window.EJS_emulator.Module.HEAPU8
                ) {
                  heap = window.EJS_emulator.Module.HEAPU8;
                }

                if (heap) {
                  let score = 0;
                  if (type === "byte") {
                    score = heap[scoreAddress];
                  } else if (type === "bcd") {
                    // Handle BCD (assuming Length bytes, little endian usually or simplified)
                    // Simple 1-byte BCD to start: 0x41 -> 41
                    // For multi-byte, we need to know layout.
                    // Let's assume standard C64 BCD: usually a sequence of bytes.
                    // Example 3 bytes: 12 34 56 -> 123456
                    let strVal = "";
                    for (let i = 0; i < length; i++) {
                      let val = heap[scoreAddress + i]; // Big endian address order? Or Little?
                      // Often scores are stored low-byte to high-byte or high-to-low.
                      // Let's assume screen code / BCD style where we just read hex vals.

                      // If little endian: value at address is lowest digits.
                      // Let's try to interpret just raw hex string for now or just single byte.
                      // If type is BCD, we treat 0x12 as 12.
                      let bcd = val.toString(16);
                      if (bcd.length < 2) bcd = "0" + bcd;
                      strVal += bcd;
                    }
                    // This is a naive BCD parser, likely needs refinement for specific games (endianness)
                    // For Hero Is Back (1 byte), 0x41 -> 41.
                    score = parseInt(strVal);
                  } else if (type === "int") {
                    // Read integer
                    let val = 0;
                    for (let i = 0; i < length; i++) {
                      val += heap[scoreAddress + i] << (i * 8); // Little endian
                    }
                    score = val;
                  } else if (type === 'string') {
                    // ASCII/PETSCII string
                    let strVal = "";
                    for (let i = 0; i < length; i++) {
                        let val = heap[scoreAddress + i];
                        // 0x30 = '0'
                        strVal += String.fromCharCode(val);
                    }
                    // Filter non-digits just in case
                    strVal = strVal.replace(/[^0-9]/g, '');
                    score = parseInt(strVal, 10);
                  }

                  if (!isNaN(score)) {
                    window.parent.postMessage(
                      { type: "SCORE_UPDATE", score: score },
                      "*",
                    );
                  }
                }
              } catch (e) {
                // Quiet fail
              }
            }, 1000);
          } catch (e) {
            console.error("Invalid score config", e);
          }
        } else {
          // FALLBACK for backward compat if needed or just log
          const scoreAddressHex = urlParams.get("scoreAddress");
          if (scoreAddressHex) {
            // ... old logic ...
            // Removed for brevity/refactor
            console.warn("Legacy scoreAddress param ignored. Use scoreConfig.");
          }
        }
      } else {
        document.body.innerHTML =
          '<div style="color:white; text-align:center; padding-top:20px; font-family:monospace;">NO ROM LOADED</div>';
      }
    </script>
  </body>
</html>
