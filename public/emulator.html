<!doctype html>
<html>
  <head>
    <title>C64 Emulator</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #000;
        overflow: hidden;
      }
      #game {
        width: 100vw;
        height: 100vh;
        display: block;
      }
      /* Anti-Cheat: Aggressively hide EmulatorJS Cheat UI */
      .ejs-menu-cheats,
      #ejs-menu-cheats,
      div[title*="Cheat"],
      div[title*="cheat"],
      .menu-item-cheats {
        display: none !important;
        pointer-events: none !important;
        opacity: 0 !important;
        visibility: hidden !important;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script>
      /**
       * C64 Memory Monitor & Score Extractor
       *
       * This script runs inside the emulator iframe. It periodically reads the WebAssembly memory (HEAP)
       * to extract the current game score based on the configuration passed in the URL.
       */

      // --- Configuration ---
      const urlParams = new URLSearchParams(window.location.search);
      const romPath = urlParams.get("rom");
      const scoreConfigJson = urlParams.get("scoreConfig");
      const difficultyConfigJson = urlParams.get("difficultyConfig");
      const palNtscConfigJson = urlParams.get("palNtscConfig");

      // Global: parsed difficulty config (if any)
      let difficultyConfig = null;
      let palNtscConfig = null;

      // Peak score tracking for game-over detection
      let peakScore = 0;
      let lastScoreTime = 0;
      let lastScoreValue = 0;
      let scoreDropAlertSent = false; // Prevent multiple triggers

      // --- Initialization ---
      if (romPath) {
        initEmulator(romPath);
        if (scoreConfigJson) {
          initMemoryMonitor(scoreConfigJson);
        }
        if (difficultyConfigJson) {
          try {
            difficultyConfig = JSON.parse(
              decodeURIComponent(difficultyConfigJson),
            );
            console.log("[DIFFICULTY] Config loaded:", difficultyConfig);
          } catch (e) {
            console.error("[DIFFICULTY] Failed to parse config:", e);
          }
        }
        if (palNtscConfigJson) {
          try {
            palNtscConfig = JSON.parse(
              decodeURIComponent(palNtscConfigJson),
            );
            console.log("[PAL/NTSC] Config loaded:", palNtscConfig);
          } catch (e) {
            console.error("[PAL/NTSC] Failed to parse config:", e);
          }
        }
      } else {
        showError("NO ROM LOADED");
      }

      function initEmulator(rom) {
        console.log("Booting C64 with ROM:", rom);

        // CRITICAL: Force warp settings in localStorage FOR THIS SPECIFIC ROM
        // EmulatorJS uses per-game settings with key: ejs-1-c64-[ROM_PATH]-settings
        try {
          const settingsKey = `ejs-1-c64-${rom}-settings`;
          let existingSettings = JSON.parse(localStorage.getItem(settingsKey) || '{}');
          
          // Default C64 controller configuration (copied from working game)
          const defaultC64Controls = {
            "0": {
              "0": { "value": 88, "value2": "BUTTON_2" },      // X
              "1": { "value": 83, "value2": "BUTTON_4" },      // S
              "2": { "value": 86, "value2": "SELECT" },        // V
              "3": { "value": 13, "value2": "START" },         // Enter
              "4": { "value": 38, "value2": "DPAD_UP" },       // Arrow Up
              "5": { "value": 40, "value2": "DPAD_DOWN" },     // Arrow Down
              "6": { "value": 37, "value2": "DPAD_LEFT" },     // Arrow Left
              "7": { "value": 39, "value2": "DPAD_RIGHT" },    // Arrow Right
              "8": { "value": 90, "value2": "BUTTON_1" },      // Z
              "9": { "value": 65, "value2": "BUTTON_3" },      // A
              "10": { "value": 81, "value2": "LEFT_TOP_SHOULDER" },  // Q
              "11": { "value": 69, "value2": "RIGHT_TOP_SHOULDER" }, // E
              "12": { "value": 9, "value2": "LEFT_BOTTOM_SHOULDER" }, // Tab
              "13": { "value": 82, "value2": "RIGHT_BOTTOM_SHOULDER" }, // R
              "14": { "value": 0, "value2": "LEFT_STICK" },
              "15": { "value": 0, "value2": "RIGHT_STICK" },
              "16": { "value": 72, "value2": "LEFT_STICK_X:+1" },
              "17": { "value": 70, "value2": "LEFT_STICK_X:-1" },
              "18": { "value": 71, "value2": "LEFT_STICK_Y:+1" },
              "19": { "value": 84, "value2": "LEFT_STICK_Y:-1" },
              "20": { "value": 76, "value2": "RIGHT_STICK_X:+1" },
              "21": { "value": 74, "value2": "RIGHT_STICK_X:-1" },
              "22": { "value": 75, "value2": "RIGHT_STICK_Y:+1" },
              "23": { "value": 73, "value2": "RIGHT_STICK_Y:-1" },
              "24": { "value": 0 },
              "25": { "value": 0 },
              "26": { "value": 0 },
              "27": { "value": 0 },
              "28": { "value": 0 },
              "29": { "value": 0 }
            },
            "1": {},
            "2": {},
            "3": {}
          };
          
          // If no settings exist, create a complete structure with default controls
          if (!existingSettings.controlSettings || !existingSettings.controlSettings["0"]?.["0"]) {
            existingSettings = {
              controlSettings: defaultC64Controls,
              settings: {},
              cheats: []
            };
          }
          
          // Force warp settings while preserving ALL existing settings
          const forcedSettings = {
            ...existingSettings,
            settings: {
              ...(existingSettings.settings || {}),
              vsync: "disabled",
              vice_autoloadwarp: "enabled",
              vice_warp_boost: "enabled",
              vice_drive_true_emulation: "disabled",
              shader: "crt-easymode.glslp",
            }
          };
          
          localStorage.setItem(settingsKey, JSON.stringify(forcedSettings));
          console.log("[EMULATOR] Forced warp settings for ROM:", rom);
          console.log("[EMULATOR] Settings key:", settingsKey);
        } catch (e) {
          console.warn("[EMULATOR] Could not force settings:", e);
        }

        // Reset peak score tracking for new game session
        peakScore = 0;
        lastScoreTime = 0;
        lastScoreValue = 0;
        scoreDropAlertSent = false;

        // EmulatorJS Core Settings
        window.EJS_player = "#game";
        window.EJS_core = "c64";
        window.EJS_gameUrl = rom;
        window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
        window.EJS_startOnLoaded = true;
        window.EJS_biosUrl = "";
        window.EJS_forceLegacyKeyboard = true;
        window.EJS_loadStateURL = null;
        window.EJS_cheats = [];
        window.EJS_Buttons = {
          saveState: false,
          loadState: false,
          quickSave: false,
          quickLoad: false,
          saveSavFiles: false,
          loadSavFiles: false,
          cheat: false,
        };
        window.EJS_gameParentUrl = window.location.href;
        window.EJS_gameID = "1";
        window.EJS_saveStateLocation = "local";

        // Load the EmulatorJS Loader
        const script = document.createElement("script");
        script.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
        script.async = true;
        document.body.appendChild(script);

        // Anti-Cheat: Observers to aggressively remove cheat-related elements
        const observer = new MutationObserver(() => {
          const cheatEls = document.querySelectorAll(
            '[title*="Cheat"], [title*="cheat"], .ejs-menu-cheats, #ejs-menu-cheats, .ejs-opt-cheats',
          );
          cheatEls.forEach((el) => el.remove());
        });
        observer.observe(document.body, { childList: true, subtree: true });

        // Hide save/load options from control settings
        const hideObserver = new MutationObserver(() => {
          // Target common EmulatorJS control settings selectors
          const selectors = [
            '[data-action*="save"]', '[data-action*="load"]',
            '.ejs-opt-save', '.ejs-opt-load',
            '[data-input*="save state"]', '[data-input*="load state"]',
            '.option-item:has(.ejs-btn-save)', '.option-item:has(.ejs-btn-load)'
          ];
          selectors.forEach(sel => {
            document.querySelectorAll(sel).forEach(el => el.style.display = 'none');
          });
        });
        hideObserver.observe(document.body, { childList: true, subtree: true });

        // Standardize Pause/Resume on Tab Switch
        // Standardize Pause/Resume on Tab Switch
        document.addEventListener("visibilitychange", () => {
          if (document.hidden) {
            if (window.EJS_emulator && window.EJS_emulator.pause) {
              console.log("Tab hidden: Pausing emulator");
              window.EJS_emulator.pause();
            }
          } else {
            // Only auto-resume if the user didn't manually pause the game
            if (
              window.EJS_emulator &&
              window.EJS_emulator.resume &&
              !isPaused
            ) {
              console.log("Tab visible: Resuming emulator");
              window.EJS_emulator.resume();
            }
            // Ensure focus returns to the game
            setTimeout(() => {
              window.focus();
              const gameDiv = document.getElementById("game");
              if (gameDiv) gameDiv.focus();
            }, 100);
          }
        });
      }

      // --- Pause Toggle (P key) ---
      let isPaused = false;

      document.addEventListener("keydown", function (e) {
        // Block save/load hotkeys (F5=Fast Save default, F9=Fast Load default)
        if (e.key === 'F5' || e.key === 'F9' ||
            (e.shiftKey && (e.key === 'F5' || e.key === 'F9'))) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }
        if (e.key === "p" || e.key === "P") {
          const emu = window.EJS_emulator;
          if (emu && typeof emu.togglePlaying === "function") {
            // If already paused (isPaused=true), we are about to UNPAUSE.
            // Ensure the emulator is running (in case it was system-paused by tab switch)
            if (isPaused && emu.resume) {
              emu.resume();
            }
            emu.togglePlaying();
            isPaused = !isPaused;
            window.parent.postMessage(
              { type: "PAUSE_STATE", paused: isPaused },
              "*",
            );
          }
        }
      });

      function showError(msg) {
        document.body.innerHTML = `<div style="color:white; text-align:center; padding-top:20px; font-family:monospace;">${msg}</div>`;
      }

      /**
       * Reads the current PAL/NTSC standard from memory
       * Returns 0 for PAL, 1 for NTSC (or default 0 if not configured)
       */
      function readPalNtsc() {
        if (!palNtscConfig || !palNtscConfig.address) return 0;

        const heap = findHeap();
        if (!heap) return 0;

        let address = parseInt(palNtscConfig.address, 16);

        // Apply base offset for PAL/NTSC if available
        if (palNtscConfig.baseOffset) {
          address += parseInt(palNtscConfig.baseOffset, 16);
        }

        if (address >= heap.length) return 0;

        let palNtscValue = heap[address] || 0;

        const now = Date.now();
        if (debugMode && now - lastLog > 5000) {
          console.log(
            `[DEBUG_PALNTSC] Addr: ${palNtscConfig.address} (Base: ${palNtscConfig.baseOffset || 0} -> Real: ${address}), Value: 0x${palNtscValue.toString(16)} (Dec: ${palNtscValue})`,
          );
        }

        return palNtscValue;
      }

      /**
       * Reads the current difficulty level from memory
       * Returns the byte value at the configured address, or 0 if not configured
       */
      function readDifficulty() {
        if (!difficultyConfig || !difficultyConfig.address) return 0;

        const heap = findHeap();
        if (!heap) return 0;

        let address = parseInt(difficultyConfig.address, 16);

        // Apply base offset for difficulty if available
        if (difficultyConfig.baseOffset) {
          address += parseInt(difficultyConfig.baseOffset, 16);
        }

        if (address >= heap.length) return 0;

        let difficultyValue = heap[address] || 0;

        const now = Date.now();
        if (debugMode && now - lastLog > 5000) {
          console.log(
            `[DEBUG_DIFFICULTY] Addr: ${difficultyConfig.address} (Base: ${difficultyConfig.baseOffset || 0} -> Real: ${address}), Value: 0x${difficultyValue.toString(16)} (Dec: ${difficultyValue})`,
          );
        }

        return difficultyValue;
      }

      // --- Memory Monitoring Logic ---

      function initMemoryMonitor(configStr) {
        try {
          const config = JSON.parse(decodeURIComponent(configStr));
          console.log("Initializing Memory Monitor:", config);

          // Probe for RAM offset
          setTimeout(() => {
            const mod = window.EJS_emulator?.Module || window.Module;
            if (mod) {
              const candidates = Object.keys(mod).filter(
                (k) =>
                  (k.startsWith("_") || k.length > 2) &&
                  (k.toLowerCase().includes("ram") ||
                    k.toLowerCase().includes("mem") ||
                    k.toLowerCase().includes("ptr") ||
                    k.toLowerCase().includes("start")),
              );
              console.log("[DEBUG_PROBE] Module Candidates:", candidates);
              // Also log values if they are numbers
              const values = {};
              candidates.forEach((k) => {
                if (typeof mod[k] === "number") values[k] = mod[k];
              });
              console.log("[DEBUG_PROBE] Candidate Values:", values);
            }
          }, 5000);

          // Start polling loop
          setInterval(() => {
            const score = extractScore(config);
            if (score !== null) {
              sendScoreToParent(score);
            }
          }, 1000);
          
          // Also start PAL/NTSC polling if configured (runs even without score changes)
          if (palNtscConfig && palNtscConfig.address) {
            let lastPalNtsc = -1;
            setInterval(() => {
              const palNtscValue = readPalNtsc();
              if (palNtscValue !== lastPalNtsc) {
                lastPalNtsc = palNtscValue;
                const standard = palNtscValue === 1 ? 'NTSC' : 'PAL';
                window.parent.postMessage(
                  { type: "PALNTSC_UPDATE", standard: standard },
                  "*",
                );
                console.log("[PAL/NTSC] Changed to:", standard);
              }
            }, 500);
          }
        } catch (e) {
          console.error("Failed to parse score config:", e);
        }
      }

      /**
       * Locates the correct Emscripten Heap (C64 RAM)
       */
      function findHeap() {
        // Option 1: Direct Module access (common in some builds)
        if (window.Module && window.Module.HEAPU8) {
          return window.Module.HEAPU8;
        }
        // Option 2: EJS wrapper access (standard for EmulatorJS)
        if (
          window.EJS_emulator &&
          window.EJS_emulator.Module &&
          window.EJS_emulator.Module.HEAPU8
        ) {
          return window.EJS_emulator.Module.HEAPU8;
        }
        return null;
      }

      /**
       * Global Helper to find a byte sequence in Memory
       * Usage in Console: hunt([0x44, 0x70]) or hunt("44 70")
       */
      window.hunt = function (pattern) {
        const heap = findHeap();
        if (!heap) return "No HEAP found";

        // Normalize pattern
        let bytes = [];
        if (typeof pattern === "string") {
          bytes = pattern.split(/[\s,]+/).map((h) => parseInt(h, 16));
        } else if (Array.isArray(pattern)) {
          bytes = pattern;
        }

        console.log(
          "Hunting for:",
          bytes.map((b) => b.toString(16).padStart(2, "0")).join(" "),
        );

        const results = [];
        for (let i = 0; i < heap.length - bytes.length; i++) {
          let match = true;
          for (let j = 0; j < bytes.length; j++) {
            if (heap[i + j] !== bytes[j]) {
              match = false;
              break;
            }
          }
          if (match) {
            results.push(i);
            // Limit results
            if (results.length > 50) break;
          }
        }

        console.log(`Found ${results.length} matches:`);
        results.forEach((addr) => {
          const hex = "0x" + addr.toString(16);
          console.log(`${hex} (Decimal: ${addr})`);
        });
        return results;
      };

      /**
       * Reads the score from memory based on config
       */
      // throttle logging
      let lastLog = 0;

      const debugMode =
        urlParams.get("debug") === "1" || urlParams.get("debug") === "true";

      function extractScore(config) {
        const heap = findHeap();
        if (!heap) return null;

        let address = parseInt(config.address, 16);

        // Add optional base offset (useful if C64 RAM starts at a specific location in Heap)
        if (config.baseOffset) {
          address += parseInt(config.baseOffset, 16);
        }

        const length = config.length || 1;
        const type = config.type || "byte";

        // Read raw bytes
        const bytes = [];
        for (let i = 0; i < length; i++) {
          // Validate memory bounds
          if (address + i >= heap.length) return null;
          bytes.push(heap[address + i]);
        }

        const now = Date.now();
        if (debugMode && now - lastLog > 5000) {
          console.log(
            `[DEBUG_SCORE] Addr: ${config.address} (Base: ${config.baseOffset || 0} -> Real: ${address}), Bytes: [${bytes.map((b) => "0x" + b.toString(16).padStart(2, "0")).join(", ")}], Type: ${type}`,
          );
          lastLog = now;
        }

        // Handle Little Endian for BCD (reverse to Big Endian for parsing)
        if (type === "bcd" && config.endianness === "little") {
          bytes.reverse();
        }

        let score = parseBytesToScore(bytes, type);

        // Apply multiplier if defined
        if (config.multiplier && typeof score === "number") {
          score *= config.multiplier;
        }

        return score;
      }

      /**
       * Decodes bytes into a number based on the format type
       */
      function parseBytesToScore(bytes, type) {
        if (type === "byte") {
          // Single byte value (0-255)
          return bytes[0];
        }

        if (type === "int") {
          // Little-endian integer
          let val = 0;
          for (let i = 0; i < bytes.length; i++) {
            val += bytes[i] << (i * 8);
          }
          return val;
        }

        if (type === "bcd") {
          // Binary Coded Decimal (e.g., 0x12 = 12)
          // Assuming Big-Endian for multi-byte BCD sequences (standard display order)
          // e.g. [0x12, 0x34] -> 1234
          let strVal = "";
          for (const b of bytes) {
            let hex = b.toString(16);
            if (hex.length < 2) hex = "0" + hex;
            strVal += hex;
          }
          return parseInt(strVal, 10);
        }

        if (type === "string") {
          // ASCII/PETSCII String (e.g. chars "0", "0", "1", "0" -> 10)
          let strVal = "";
          for (const b of bytes) {
            strVal += String.fromCharCode(b);
          }
          // Sanitize: keep only digits
          strVal = strVal.replace(/[^0-9]/g, "");
          return parseInt(strVal, 10);
        }

        return 0;
      }

      /**
       * Monitor score for peak tracking and game-over detection
       * Triggers SCORE_DROP_DETECTED when score drops >70% within 5 seconds
       */
      function monitorPeakScore(score) {
        const now = Date.now();

        if (score > peakScore) {
          peakScore = score;
        }

        // Detect dramatic drop (game over signal)
        // Only trigger if: previous score was > 50, dropped >70%, happened within 5 seconds
        if (lastScoreValue > 50 && score < lastScoreValue * 0.3 && now - lastScoreTime < 5000) {
          if (!scoreDropAlertSent) {
            scoreDropAlertSent = true; // Prevent re-triggering
            console.log("[PEAK] Game over detected. Peak:", peakScore, "Final:", score);
            window.parent.postMessage({
              type: 'SCORE_DROP_DETECTED',
              peakScore: peakScore,
              finalScore: score,
              timestamp: now
            }, '*');
          }
        }

        lastScoreValue = score;
        lastScoreTime = now;
      }

      function sendScoreToParent(score) {
        if (!isNaN(score)) {
          const difficulty = readDifficulty();
          const palNtscValue = readPalNtsc();

          // Track peak score and detect drops
          monitorPeakScore(score);

          window.parent.postMessage(
            { type: "SCORE_UPDATE", score: score, difficulty: difficulty, palNtsc: palNtscValue },
            "*",
          );
          
          // Also send separate PAL/NTSC update message
          const standard = palNtscValue === 1 ? 'NTSC' : 'PAL';
          window.parent.postMessage(
            { type: "PALNTSC_UPDATE", standard: standard },
            "*",
          );
        }
      }
    </script>
  </body>
</html>
