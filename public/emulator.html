<!doctype html>
<html>
  <head>
    <title>C64 Emulator</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #000;
        overflow: hidden;
      }
      #game {
        width: 100vw;
        height: 100vh;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script>
      /**
       * C64 Memory Monitor & Score Extractor
       * 
       * This script runs inside the emulator iframe. It periodically reads the WebAssembly memory (HEAP)
       * to extract the current game score based on the configuration passed in the URL.
       */

      // --- Configuration ---
      const urlParams = new URLSearchParams(window.location.search);
      const romPath = urlParams.get("rom");
      const scoreConfigJson = urlParams.get("scoreConfig");

      // --- Initialization ---
      if (romPath) {
        initEmulator(romPath);
        if (scoreConfigJson) {
           initMemoryMonitor(scoreConfigJson);
        }
      } else {
        showError("NO ROM LOADED");
      }

      function initEmulator(rom) {
        console.log("Booting C64 with ROM:", rom);
        window.EJS_player = "#game";
        window.EJS_core = "c64";
        window.EJS_gameUrl = rom;
        window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
        window.EJS_startOnLoaded = true;
        window.EJS_biosUrl = "";
        
        // Load the EmulatorJS Loader
        const script = document.createElement("script");
        script.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
        script.async = true;
        document.body.appendChild(script);
      }

      function showError(msg) {
        document.body.innerHTML = `<div style="color:white; text-align:center; padding-top:20px; font-family:monospace;">${msg}</div>`;
      }

      // --- Memory Monitoring Logic ---

      function initMemoryMonitor(configStr) {
        try {
            const config = JSON.parse(decodeURIComponent(configStr));
            console.log("Initializing Memory Monitor:", config);
            
            // Start polling loop
            setInterval(() => {
                const score = extractScore(config);
                if (score !== null) {
                    sendScoreToParent(score);
                }
            }, 1000);

        } catch (e) {
            console.error("Failed to parse score config:", e);
        }
      }

      /**
       * Locates the correct Emscripten Heap (C64 RAM)
       */
      function findHeap() {
        // Option 1: Direct Module access (common in some builds)
        if (window.Module && window.Module.HEAPU8) {
            return window.Module.HEAPU8;
        }
        // Option 2: EJS wrapper access (standard for EmulatorJS)
        if (window.EJS_emulator && window.EJS_emulator.Module && window.EJS_emulator.Module.HEAPU8) {
            return window.EJS_emulator.Module.HEAPU8;
        }
        return null;
      }

      /**
       * Reads the score from memory based on config
       */
      function extractScore(config) {
        const heap = findHeap();
        if (!heap) return null;

        const address = parseInt(config.address, 16);
        const length = config.length || 1;
        const type = config.type || 'byte';

        // Read raw bytes
        const bytes = [];
        for (let i = 0; i < length; i++) {
            // Validate memory bounds
            if (address + i >= heap.length) return null;
            bytes.push(heap[address + i]);
        }

        return parseBytesToScore(bytes, type);
      }

      /**
       * Decodes bytes into a number based on the format type
       */
      function parseBytesToScore(bytes, type) {
        if (type === 'byte') {
            // Single byte value (0-255)
            return bytes[0];
        } 
        
        if (type === 'int') {
            // Little-endian integer
            let val = 0;
            for (let i = 0; i < bytes.length; i++) {
                val += bytes[i] << (i * 8); 
            }
            return val;
        } 
        
        if (type === 'bcd') {
            // Binary Coded Decimal (e.g., 0x12 = 12)
            // Assuming Big-Endian for multi-byte BCD sequences (standard display order)
            // e.g. [0x12, 0x34] -> 1234
            let strVal = "";
            for (const b of bytes) {
                let hex = b.toString(16);
                if (hex.length < 2) hex = "0" + hex;
                strVal += hex;
            }
            return parseInt(strVal, 10);
        }

        if (type === 'string') {
             // ASCII/PETSCII String (e.g. chars "0", "0", "1", "0" -> 10)
             let strVal = "";
             for (const b of bytes) {
                strVal += String.fromCharCode(b);
             }
             // Sanitize: keep only digits
             strVal = strVal.replace(/[^0-9]/g, '');
             return parseInt(strVal, 10);
        }

        return 0;
      }

      function sendScoreToParent(score) {
        if (!isNaN(score)) {
            window.parent.postMessage({ type: "SCORE_UPDATE", score: score }, "*");
        }
      }
    </script>
  </body>
</html>
